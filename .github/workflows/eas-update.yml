name: EAS Update on Push

on:
  push:
    branches:
      - OTA-Implementation  # <--- Triggers only when you push to this branch

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v3

      - name: nodes Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Publish Update (Preview)
        run: eas update --branch preview --message "Auto-update from GitHub: ${{ github.event.head_commit.message }}"
